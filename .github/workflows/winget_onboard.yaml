name: Winget Onboarding / Update

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages.csv'

jobs:
  onboard:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas requests PyYAML

      - name: Sync fork and onboard (gated on first acceptance)
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f flags/winget-not-accepted ]; then
            echo "Winget packages not yet accepted — skipping automatic updates."
            exit 0
          fi
          echo "Syncing fork with upstream..."
          gh repo sync af-community-maintainer/winget-pkgs
          echo "Running winget onboarding/update..."
          python scripts/winget_onboard.py